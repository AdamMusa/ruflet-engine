name: ruflet_native_example
description: >-
  Development app for packages/ruflet/native: runs the integration tests on
  the iOS simulator and the Android emulator. Never shipped. Its android/ and
  ios/ host folders are generated by ../prepare_example.sh, never committed.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  ruflet:
    path: ../../../packages/ruflet
  ruflet_native:
    path: ../../../packages/ruflet/native
  ruflet_native_wire:
    path: ../wire_harness
  device_info_plus: any
  ffi: ^2.1.3
  jni: any
  objective_c: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Copied from packages/ruflet/native/test/fixtures by ../prepare_example.sh
  # as <feature>.<platform>.json.
  assets:
    - fixtures/
