name: ruflet_native_fixture_recorder
description: >-
  Records ruflet_native's contract fixtures from the OLD plugins: plays the
  messages Ruby sends through a real RufletBackend with today's core and
  ruflet_<feature> packages and writes the replies and events to
  packages/ruflet/native/test/fixtures/. Dev tooling, never shipped. Host
  folders are generated by ../prepare_example.sh fixture_recorder.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  ruflet:
    path: ../../../packages/ruflet
  ruflet_native_wire:
    path: ../wire_harness
  device_info_plus: any
  # The recording helper in lib/ reports through the integration_test binding.
  integration_test:
    sdk: flutter
  # ../prepare_example.sh writes pubspec.yaml from this file and inserts
  # every deps/<feature>.yaml here (the old ruflet_<feature> packages), so
  # feature PRs only add files.
  # ruflet_native_recorder_deps

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
