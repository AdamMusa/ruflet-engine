name: Test

# Analyzes and tests the core and every extension package on the Flutter the
# Ruflet CI builds clients with, checks the checked-in Ruby control surface
# against ruflet main, and compiles the core on current Flutter stable, which
# is what `ruflet build` downloads when an app pins no Flutter version.

on:
  push:
    branches: [codex/engine-initialization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches flutter-version in ruflet's .github/workflows. Raise both
  # together, deliberately.
  FLUTTER_VERSION: 3.41.2

# ubuntu-24.04, not ubuntu-latest: ruby/setup-ruby has no build of ruflet's
# .ruby-version Ruby for ubuntu-26.04, and ruflet CI pins the same image.
jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - ruflet
          # ruflet_native: the FFI plugin nested in the core folder.
          - ruflet/native
          - ruflet_ads
          - ruflet_audio
          - ruflet_audio_recorder
          - ruflet_camera
          - ruflet_charts
          - ruflet_code_editor
          - ruflet_color_pickers
          - ruflet_datatable2
          - ruflet_flashlight
          - ruflet_geolocator
          - ruflet_local_auth
          - ruflet_lottie
          - ruflet_map
          - ruflet_permission_handler
          - ruflet_qrcode_scanner
          - ruflet_rive
          - ruflet_secure_storage
          - ruflet_spinkit
          - ruflet_video
          - ruflet_webview
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          if [ -d test ]; then flutter analyze lib test; else flutter analyze lib; fi

      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "No tests in ${{ matrix.package }}"; fi

  native-checks:
    name: ruflet_native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Everything is Dart over FFI: no Java/Kotlin/Objective-C/Swift/C
      # source and no platform channel.
      - name: No native sources
        run: tool/ruflet_native/check_no_native_sources.sh

      - name: No platform channels
        run: tool/ruflet_native/check_no_channels.sh

      # Each service glue file is today's service file with recorded
      # substitutions; a later fix to the source must reach the copy.
      - name: Glue matches its source
        run: tool/ruflet_native/check_glue_drift.sh

      - name: Privacy manifest covers the code
        run: tool/ruflet_native/check_privacy.sh

      - name: Version pins
        run: |
          (cd packages/ruflet && flutter pub get)
          tool/ruflet_native/check_pins.sh

      # The web never imports dart:ffi, jni or objective_c.
      - name: Web compile of every feature library
        run: |
          tool/ruflet_native/prepare_example.sh example --web
          cd tool/ruflet_native/example
          flutter pub get
          flutter build web -t lib/all_features.dart

      - name: Analyze the dev tooling
        run: |
          tool/ruflet_native/prepare_example.sh fixture_recorder
          for dir in tool/ruflet_native/wire_harness tool/ruflet_native/example tool/ruflet_native/fixture_recorder; do
            (cd "$dir" && flutter pub get && flutter analyze)
          done

  ruby-surface:
    name: Ruby control surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: engine

      - name: Checkout ruflet
        uses: actions/checkout@v5
        with:
          repository: AdamMusa/ruflet
          ref: main
          path: ruflet

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: ruflet

      # A Ruby change that adds or renames keywords pairs with an engine PR
      # that runs `ruby tool/sync_ruby_surface.rb --ruby <ruflet checkout>`.
      # This reads ruflet main as it is when the job runs, so once such a
      # Ruby change merges, this job fails on every engine PR until that
      # engine sync lands.
      - name: Check the checked-in surface matches ruflet main
        working-directory: engine/packages/ruflet
        run: |
          if ! ruby tool/sync_ruby_surface.rb --ruby "$GITHUB_WORKSPACE/ruflet" --check; then
            ruflet_head=$(git -C "$GITHUB_WORKSPACE/ruflet" rev-parse --short HEAD)
            echo "::error::The checked-in Ruby control surface differs from ruflet main ($ruflet_head). Unless this PR edits packages/ruflet/test/contract/ruflet_control_surface.json, ruflet main has moved: land the engine PR that runs ruby tool/sync_ruby_surface.rb --ruby <ruflet checkout>."
            exit 1
          fi

  flutter-stable:
    name: ${{ matrix.package }} on Flutter stable (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Advisory: a new Flutter release can break an untouched tree. This job
    # reports that early without blocking work on the pinned version.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [ruflet, ruflet/native]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # Infos only: new deprecations are expected on a newer Flutter.
      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Test
        run: flutter test
