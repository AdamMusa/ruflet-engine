// ruflet_native on Android: build configuration only. The plugin has no Java
// or Kotlin source: its Dart code calls the Android APIs over JNI
// (package:jni). This file only adds, for each enabled feature, the Gradle
// dependencies, manifest entries and ProGuard keeps that feature needs.
//
// Features are discovered by file name, so a feature PR adds files under
// features/ and never edits this file:
//   features/<feature>.gradle   dependencies (applied with `apply from:`)
//   features/<feature>.xml      manifest entries (children of <manifest>)
//   features/<feature>.pro      consumer ProGuard rules for classes reached
//                               only over JNI (R8 cannot see those calls)
//   proguard/shared.pro         keeps for the shared JNI layer (always on)
//   features/CORE               the core feature names, one per line (equal
//                               to coreFeatures in lib/src/registry.dart;
//                               test/registry_test.dart checks it)
//
// The enabled set, in this order:
//   1. the Gradle property ruflet.native.features (comma list, or "all");
//   2. otherwise the app's resolved Dart packages: the core features, plus
//      every extension feature whose wrapper package ruflet_<feature> is in
//      <app>/.dart_tool/package_config.json. That is what the Ruflet CLI's
//      `extensions:` selection keeps, so no CLI change is needed;
//   3. otherwise the core features only.
// Both inputs are read through Gradle providers, so a changed property or a
// changed package set re-resolves the features under the configuration cache.

group = 'dev.ruflet.ruflet_native'
version = '0.1.0'

apply plugin: 'com.android.library'

def featureFiles = file('features')
def coreFeatures = providers.fileContents(layout.projectDirectory.file('features/CORE'))
        .asText.get().readLines()
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') }
def knownFeatures = (featureFiles.listFiles() ?: [])
        .findAll { it.isFile() && it.name ==~ /[a-z0-9_]+\.(gradle|xml|pro)/ }
        .collect { it.name.substring(0, it.name.lastIndexOf('.')) }
        .toSet()

def requested = providers.gradleProperty('ruflet.native.features').orNull
def enabled
if (requested != null && requested.trim()) {
    def names = requested.split(',').collect { it.trim() }.findAll { it }
    enabled = names.contains('all') ? (coreFeatures + knownFeatures) : names
} else {
    def config = rootProject.layout.projectDirectory.file('../.dart_tool/package_config.json')
    def text = providers.fileContents(config).asText.orNull
    if (text != null) {
        def packages = new groovy.json.JsonSlurper().parseText(text).packages
                .collect { it.name }
                .toSet()
        enabled = coreFeatures + knownFeatures.findAll {
            !coreFeatures.contains(it) && packages.contains("ruflet_${it}".toString())
        }
    } else {
        enabled = coreFeatures
    }
}
enabled = enabled.unique().sort()

def gradleParts = enabled.findAll { file("features/${it}.gradle").isFile() }
def manifestParts = enabled.findAll { file("features/${it}.xml").isFile() }
def proguardParts = enabled.findAll { file("features/${it}.pro").isFile() }

def manifestText = new StringBuilder()
manifestText << '<?xml version="1.0" encoding="utf-8"?>\n'
manifestText << '<!-- Generated by ruflet_native/android/build.gradle for: ' << enabled.join(', ') << ' -->\n'
manifestText << '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
manifestText << '    xmlns:tools="http://schemas.android.com/tools">\n'
manifestParts.each { name ->
    manifestText << "    <!-- ${name} -->\n"
    manifestText << file("features/${name}.xml").text.trim().readLines().collect { '    ' + it }.join('\n') << '\n'
}
manifestText << '</manifest>\n'
def manifestContent = manifestText.toString()
def generatedManifest = layout.buildDirectory.file('generated/ruflet_native/AndroidManifest.xml')

// Written by a task (not at configuration time), so a configuration-cache hit
// after the build directory was deleted still recreates it.
def writeManifest = tasks.register('rufletNativeManifest') {
    inputs.property('content', manifestContent)
    outputs.file(generatedManifest)
    doLast {
        def out = generatedManifest.get().asFile
        out.parentFile.mkdirs()
        out.text = manifestContent
    }
}
tasks.named('preBuild') { dependsOn(writeManifest) }

android {
    namespace = 'dev.ruflet.ruflet_native'
    compileSdk = flutter.compileSdkVersion

    defaultConfig {
        minSdk = flutter.minSdkVersion
        consumerProguardFiles('proguard/shared.pro',
                *proguardParts.collect { "features/${it}.pro" })
    }

    sourceSets {
        main {
            manifest.srcFile generatedManifest.get().asFile
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

gradleParts.each { name -> apply from: "features/${name}.gradle" }

logger.info("ruflet_native: Android features ${enabled}")
