name: ruflet_flashlight
repository: https://github.com/AdamMusa/ruflet-engine
description: Ruflet Flashlight control
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.35.6"

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.16.0
  # Direct native calls instead of a platform plugin: JNI on Android,
  # the Objective-C runtime on iOS.
  ffi: ^2.1.0
  jni: ^1.2.1
  jni_flutter: ^1.1.0
  objective_c: ^9.5.0

  ruflet:
    path: ../ruflet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
